name: Release All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da release (ex: 1.0.1)'
        required: true
        default: '1.0.1'

permissions:
  contents: write

jobs:
  build-windows-wpf:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $inputVer = "${{ github.event.inputs.version }}"
          $refName = "${{ github.ref_name }}"
          $raw = if ($inputVer) { $inputVer } else { $refName }
          $clean = $raw.TrimStart('v', 'V')
          if (-not $clean -or $clean -eq 'master' -or $clean -eq 'main') { $clean = "1.0.0" }
          echo "version=$clean" >> $env:GITHUB_OUTPUT

      - name: Publish TVLocal.Wpf
        run: dotnet publish csharp/src/TVLocal.Wpf/TVLocal.Wpf.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.ver.outputs.version }} -o dist-wpf

      - name: Zip WPF release
        shell: pwsh
        run: Compress-Archive -Path dist-wpf\* -DestinationPath TVLocal-Wpf-win-x64.zip -Force

      - name: Upload WPF artifact
        uses: actions/upload-artifact@v4
        with:
          name: wpf-win-x64
          path: TVLocal-Wpf-win-x64.zip

  build-desktop-electron:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync release version
        shell: pwsh
        run: |
          $inputVer = "${{ github.event.inputs.version }}"
          $refName = "${{ github.ref_name }}"
          $raw = if ($inputVer) { $inputVer } else { $refName }
          $clean = $raw.TrimStart('v', 'V')
          if (-not $clean -or $clean -eq 'master' -or $clean -eq 'main') { $clean = "1.0.0" }
          npm version $clean --no-git-tag-version --workspace=@tv-local/desktop --allow-same-version
          "{ `"version`": `"$clean`" }" | Set-Content -Path apps/web/public/version.json -Encoding UTF8

      - name: Package Electron Windows
        run: npm --workspace=@tv-local/desktop run package:win

      - name: Upload Electron release files
        uses: actions/upload-artifact@v4
        with:
          name: electron-win
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml

  publish-release:
    needs: [build-windows-wpf, build-desktop-electron]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          INPUT_VER="${{ github.event.inputs.version }}"
          REF_NAME="${{ github.ref_name }}"
          if [ -n "$INPUT_VER" ]; then
            CLEAN="${INPUT_VER#v}"
            CLEAN="${CLEAN#V}"
            echo "tag_name=v${CLEAN}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download WPF artifact
        uses: actions/download-artifact@v4
        with:
          name: wpf-win-x64
          path: release-assets

      - name: Download Electron artifact
        uses: actions/download-artifact@v4
        with:
          name: electron-win
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          generate_release_notes: true
          files: release-assets/*

  publish-mobile-ota:
    runs-on: ubuntu-latest
    steps:
      - name: Check EXPO_TOKEN
        id: expo_check
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.expo_check.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.expo_check.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Expo & EAS
        if: steps.expo_check.outputs.enabled == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.expo_check.outputs.enabled == 'true'
        run: npm ci

      - name: Publish Mobile OTA Update
        if: steps.expo_check.outputs.enabled == 'true'
        working-directory: apps/mobile
        run: eas update --branch production --message "Release ${{ github.ref_name }}" --non-interactive
